<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #0f172a;
            text-align: center;
            padding: 1rem;
        }
        .card {
            max-width: 24rem;
        }
        h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
        p { color: #64748b; font-size: 0.925rem; margin-bottom: 1.5rem; }
        button {
            background: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 0.5rem;
            padding: 0.625rem 1.25rem;
            font-size: 0.925rem;
            cursor: pointer;
        }
        button:hover { background: #4338ca; }
    </style>
</head>
<body>
    <div class="card">
        <h1>You're offline</h1>
        <p>This page hasn't been loaded before, so it isn't available without a connection. Pages you've already visited will still work.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
